name: Release & Build Docker

on:
    workflow_dispatch:
        inputs:
            version:
                description: "发布版本号"
                required: true
                type: string
            push_latest:
                description: "是否标记为 Docker latest"
                required: false
                type: boolean
                default: true
            description:
                description: "发布说明"
                required: false
                type: string
                default: ""

permissions:
    contents: write

jobs:
    build-and-publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: heai/theresa
                  tags: |
                      type=raw,value=${{ inputs.version }}
                      type=raw,value=latest,enable=${{ inputs.push_latest }}

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: heai
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64

            - name: Package Files
              run: |
                  mkdir -p dist
                  tar -czvf dist/docker-compose-${{ inputs.version }}.tar.gz README.md compose.yaml configs/*.template scripts/docker_compose_init.sh

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ inputs.version }}
                  body: |
                      ${{ inputs.description }}
                      Download: `curl -LO https://github.com/crane-fog/QQ-Bot/releases/download/${{ inputs.version }}/docker-compose-${{ inputs.version }}.tar.gz`
                  working_directory: dist
                  files: |
                      docker-compose-${{ inputs.version }}.tar.gz
