name: CI

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv sync --all-extras

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run pytest

  webcontroller:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Verify source configuration workflows
        run: uv run pytest tests/test_deployment_toml.py tests/test_deployment_source.py tests/test_deployment_api.py
      - name: Run isolated Docker acceptance
        if: matrix.os == 'ubuntu-latest'
        env:
          RUN_WEB_DOCKER_TESTS: "1"
        run: uv run pytest tests/test_deployment_docker.py -v
